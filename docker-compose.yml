services:
  # --------------------------------------------------------
  # Database Layer
  # --------------------------------------------------------
  postgres_db:
    image: postgres:16-alpine
    container_name: radar_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=radar_user
      - POSTGRES_PASSWORD=secure_password
      - POSTGRES_DB=math_radar
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - radar_network

  # --------------------------------------------------------
  # Caching & Message Broker Layer
  # --------------------------------------------------------
  redis_cache:
    image: redis:7-alpine
    container_name: radar_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - radar_network

  # --------------------------------------------------------
  # API Service Layer
  # --------------------------------------------------------
  fastapi_service:
    build:
      context: ./future/fastapi
      dockerfile: Dockerfile
    container_name: radar_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://radar_user:secure_password@radar_db:5432/math_radar
      - REDIS_URL=redis://radar_redis:6379/0
    volumes:
      - ./future/fastapi/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      - postgres_db
      - redis_cache
    networks:
      - radar_network

  # --------------------------------------------------------
  # Orchestration Layer: Celery Worker
  # --------------------------------------------------------
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: math-research-radar-worker:latest
    container_name: radar_worker
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=production
      - DATABASE_URL=postgresql://radar_user:secure_password@radar_db:5432/math_radar
      - REDIS_URL=redis://radar_redis:6379/0
    volumes:
      - ./data/papers:/app/papers
      - ./data/stats:/app/stats
      - ./data/cache:/app/cache
      - ./data/logs:/app/logs
      - ./docs:/app/docs
      - ./README.md:/app/README.md
    command: ["celery", "-A", "radar.tasks", "worker", "--loglevel=info"]
    depends_on:
      - postgres_db
      - redis_cache
    networks:
      - radar_network

  # --------------------------------------------------------
  # Orchestration Layer: Celery Beat (Scheduler)
  # --------------------------------------------------------
  celery_beat:
    # Uses the exact same image built by celery_worker
    image: math-research-radar-worker:latest
    container_name: radar_beat
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=production
      - REDIS_URL=redis://radar_redis:6379/0
    command: ["celery", "-A", "radar.tasks", "beat", "--loglevel=info"]
    depends_on:
      - redis_cache
      - celery_worker
    networks:
      - radar_network

networks:
  radar_network:
    name: radar_internal_network
    driver: bridge