name: Continuous Integration

# Trigger the pipeline on pushes or pull requests to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # --------------------------------------------------------
  # 🐍 Backend Pipeline (Python / FastAPI / Celery)
  # --------------------------------------------------------
  backend-lint-and-test:
    name: Python Backend CI
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Speeds up execution by caching pip downloads

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # Installs the package along with 'dev' dependencies (ruff, pytest)
          pip install -e '.[dev]'

      - name: 🧹 Lint with Ruff
        run: |
          # Fails the build if syntax errors or style violations are found
          ruff check .

      - name: 🧪 Run Pytest
        run: |
          # Check if a tests directory exists; if so, run pytest
          if [ -d "tests" ]; then
            pytest -v
          else
            echo "No 'tests/' directory found. Skipping pytest."
          fi

  # --------------------------------------------------------
  # ⚛️ Frontend Pipeline (Next.js / TypeScript)
  # --------------------------------------------------------
  frontend-lint-and-build:
    name: Next.js Frontend CI
    runs-on: ubuntu-latest
    
    # Run all steps in this job from the Next.js directory
    defaults:
      run:
        working-directory: ./future/nextjs

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: future/nextjs/package-lock.json

      - name: 📦 Install Node Dependencies
        # npm ci is strictly for CI environments; it perfectly mirrors package-lock.json
        run: npm ci

      - name: 🧹 Lint Next.js & TypeScript
        run: npm run lint

      - name: 🏗️ Verify Production Build
        # Ensures the project can successfully build without Type or Server Component errors
        run: npm run build