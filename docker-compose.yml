services:
  # --------------------------------------------------------
  # Core Data Extraction Pipeline
  # --------------------------------------------------------
  radar-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: math-research-radar:latest
    container_name: radar_engine
    restart: "no"
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=production
      # DB Connection string for the orchestrator
      - DATABASE_URL=postgresql://radar_user:secure_password@radar_db:5432/math_radar
    volumes:
      - ./data/papers:/app/papers
      - ./data/stats:/app/stats
      - ./data/cache:/app/cache
      - ./data/logs:/app/logs
      - ./docs:/app/docs
      - ./README.md:/app/README.md
    depends_on:
      - postgres_db
    networks:
      - radar_network

  # --------------------------------------------------------
  # Database Layer
  # --------------------------------------------------------
  postgres_db:
    image: postgres:16-alpine
    container_name: radar_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=radar_user
      - POSTGRES_PASSWORD=secure_password
      - POSTGRES_DB=math_radar
    ports:
      - "5432:5432"
    volumes:
      # Map database files to our unified data/ directory
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - radar_network

