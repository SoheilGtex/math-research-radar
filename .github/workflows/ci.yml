name: Continuous Integration & Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/math-radar

jobs:
  # --------------------------------------------------------
  # 1. 🐍 Backend Pipeline (Lint & Unit Tests)
  # --------------------------------------------------------
  backend-ci:
    name: Python Lint & Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: 🧹 Lint with Ruff
        run: ruff check .

      - name: 🧪 Run Pytest Suite
        run: pytest -v

  # --------------------------------------------------------
  # 2. ⚛️ Frontend Pipeline (Lint & Next.js Build)
  # --------------------------------------------------------
  frontend-ci:
    name: Next.js Lint & Build
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./future/nextjs

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: future/nextjs/package-lock.json

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: 🧹 Lint Next.js & TypeScript
        run: npm run lint

      - name: 🏗️ Verify Production Build
        run: npm run build

  # --------------------------------------------------------
  # 3. 🚀 Continuous Deployment (Build & Push Docker Images)
  # --------------------------------------------------------
  publish-docker-images:
    name: Build & Publish Container Images
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Convert repository owner to lowercase for Docker image naming standard
      - name: 🏷️ Set Lowercase Repository Name
        id: repo_name
        run: echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: 🐳 Build and Push Backend Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/math-radar-worker:latest

      - name: 🐳 Build and Push FastAPI Image
        uses: docker/build-push-action@v5
        with:
          context: ./future/fastapi
          file: ./future/fastapi/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/math-radar-api:latest

      - name: 🐳 Build and Push Next.js Dashboard Image
        uses: docker/build-push-action@v5
        with:
          context: ./future/nextjs
          file: ./future/nextjs/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/math-radar-dashboard:latests