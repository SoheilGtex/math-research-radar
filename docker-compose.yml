services:
  # --------------------------------------------------------
  # Core Data Extraction Pipeline (Runs on demand)
  # --------------------------------------------------------
  radar-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: math-research-radar:latest
    container_name: radar_engine
    restart: "no"
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=production
      - DATABASE_URL=postgresql://radar_user:secure_password@radar_db:5432/math_radar
    volumes:
      - ./data/papers:/app/papers
      - ./data/stats:/app/stats
      - ./data/cache:/app/cache
      - ./data/logs:/app/logs
      - ./docs:/app/docs
      - ./README.md:/app/README.md
    depends_on:
      - postgres_db
    networks:
      - radar_network

  # --------------------------------------------------------
  # Database Layer
  # --------------------------------------------------------
  postgres_db:
    image: postgres:16-alpine
    container_name: radar_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=radar_user
      - POSTGRES_PASSWORD=secure_password
      - POSTGRES_DB=math_radar
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - radar_network

  # --------------------------------------------------------
  # API Service Layer
  # --------------------------------------------------------
  fastapi_service:
    build:
      context: ./future/fastapi
      dockerfile: Dockerfile
    container_name: radar_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Instruct FastAPI to connect to radar_db using Docker's internal DNS
      - DATABASE_URL=postgresql://radar_user:secure_password@radar_db:5432/math_radar
    volumes:
      # Bind mount for Hot Reloading during development
      - ./future/fastapi/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      - postgres_db
    networks:
      - radar_network

  # --------------------------------------------------------
  # Future Architecture Blueprint (Commented)
  # --------------------------------------------------------
  # redis_cache: ...
  # nextjs_dashboard: ...

networks:
  radar_network:
    name: radar_internal_network
    driver: bridge