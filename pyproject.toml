[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "math-research-radar"
version = "0.1.0"
description = "Automated Research Intelligence Platform for Mathematics"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests==2.32.3",
    "feedparser==6.0.11",
    "urllib3<2",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "celery>=5.3.6",
    "redis>=5.0.4"
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "ruff==0.5.2",
    "httpx>=0.27.0"
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"] # Ignore line length warnings for HTML/Markdown strings