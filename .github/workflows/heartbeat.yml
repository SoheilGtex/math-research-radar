name: GitHub Profile Heartbeat

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Ping File
        run: |
          echo "Last automated check-in: $(date)" > PING.md
          
          # GitHub only counts commits associated with this exact account email for the contribution graph
          git config --local user.email "soheilsalmanisafarpour@gmail.com"
          git config --local user.name "SoheilGtex"
          
          git add PING.md
          git commit -m "chore: daily profile activity ping" || echo "No changes"
          git push